services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Keep the SQLite file inside the persisted data volume
      SQLITE_DB_PATH: data/contracts_ai.db
      UPLOAD_DIR: uploads
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "8008:8008"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
